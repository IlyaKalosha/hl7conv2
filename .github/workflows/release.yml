name: Release

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  MATURIN_VERSION: v1.14.1
  MATURIN_BUILD_ARGS: --release --locked --out dist --compatibility pypi --find-interpreter

jobs:
  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist/*.tar.gz

  linux-gnu:
    name: Linux manylinux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, x86, aarch64]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up QEMU
        if: matrix.target == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: 2_28
          args: ${{ env.MATURIN_BUILD_ARGS }}

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-gnu-${{ matrix.target }}
          path: dist/*.whl

  musllinux:
    name: Linux musllinux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, x86, aarch64]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up QEMU
        if: matrix.target == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: musllinux_1_2
          args: ${{ env.MATURIN_BUILD_ARGS }}

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-musllinux-${{ matrix.target }}
          path: dist/*.whl

  windows:
    name: Windows (${{ matrix.platform.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: x86_64
            python_arch: x64
          - target: x86
            python_arch: x86
          - target: aarch64
            python_arch: x64
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.platform.python_arch }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          args: ${{ env.MATURIN_BUILD_ARGS }}
        env:
          XWIN_VERSION: "16"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist/*.whl

  macos:
    name: macOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            python_arch: x64
          - target: aarch64
            python_arch: arm64
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          args: ${{ env.MATURIN_BUILD_ARGS }}

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist/*.whl

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [sdist, linux-gnu, musllinux, windows, macos]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: false
          path: wheel-artifacts

      - name: Collect and validate wheels
        run: |
          python -c "
          import shutil, sys, zipfile
          from pathlib import Path

          dist = Path('dist')
          dist.mkdir(exist_ok=True)
          wheels = sorted(Path('wheel-artifacts').rglob('*.whl'))
          if not wheels:
              print('No wheels found', file=sys.stderr)
              sys.exit(1)

          for src in wheels:
              dest = dist / src.name
              try:
                  with zipfile.ZipFile(src) as zf:
                      if zf.testzip() is not None:
                          raise zipfile.BadZipFile('testzip failed')
              except Exception as exc:
                  print(f'SKIP corrupt source {src}: {exc}', file=sys.stderr)
                  continue
              if dest.exists():
                  print(f'WARN duplicate {src.name}, keeping last valid copy', file=sys.stderr)
              shutil.copy2(src, dest)

          final = list(dist.glob('*.whl'))
          bad = []
          for whl in final:
              try:
                  with zipfile.ZipFile(whl) as zf:
                      if zf.testzip() is not None:
                          bad.append(whl.name)
              except Exception as exc:
                  bad.append(f'{whl.name}: {exc}')
          if bad:
              print('Corrupt wheels in dist:', *bad, sep='\n  ', file=sys.stderr)
              sys.exit(1)
          print(f'Collected {len(final)} wheels for upload')
          "

      - name: Collect sdist
        run: |
          mkdir -p dist
          find wheel-artifacts -name '*.tar.gz' -exec cp {} dist/ \;
          ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist
