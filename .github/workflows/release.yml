name: Release

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
    - uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install cibuildwheel
      run: python -m pip install --upgrade pip cibuildwheel

    - name: Preinstall maturin for non-isolated build
      run: python -m pip install "maturin>=1.13"

    - name: Set up QEMU (for cross-arch Linux builds)
      if: startsWith(matrix.os, 'ubuntu')
      uses: docker/setup-qemu-action@v3
      with:
        platforms: all

    - name: Build wheels
      env:
        CIBW_BUILD: cp38-* cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*
        CIBW_SKIP: pp* *-musllinux_s390x*
        CIBW_ENABLE: cpython-freethreading
        CIBW_TEST_COMMAND: python -c "import hl7conv2; from hl7conv2 import Hl7Json, JsonHl7"
        CIBW_ARCHS_LINUX: x86_64 i686 aarch64
        CIBW_ARCHS_MACOS: universal2
        CIBW_ARCHS_WINDOWS: AMD64 x86 ARM64
        CIBW_BUILD_FRONTEND: pip
        CIBW_BUILD_FRONTEND_ARGS: --no-build-isolation
        CIBW_BEFORE_BUILD_LINUX: |
          set -eux
          python -m pip install -U maturin[patchelf]
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          . "$HOME/.cargo/env"
          rustup target add \
            x86_64-unknown-linux-gnu \
            i686-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            x86_64-unknown-linux-musl \
            i686-unknown-linux-musl \
            aarch64-unknown-linux-musl
        CIBW_ENVIRONMENT_LINUX: PATH="$HOME/.cargo/bin:$PATH"
        CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=10.12
        CIBW_MACOSX_DEPLOYMENT_TARGET: 10.12
        CIBW_BEFORE_BUILD_MACOS: |
          python -m pip install -U maturin
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
        CIBW_BEFORE_BUILD_WINDOWS: |
          python -m pip install -U maturin
          rustup target add \
            x86_64-pc-windows-msvc \
            i686-pc-windows-msvc \
            aarch64-pc-windows-msvc
      run: python -m cibuildwheel --output-dir wheelhouse

    - name: Verify wheels
      run: |
        python -c "
        import glob, sys, zipfile
        wheels = glob.glob('wheelhouse/*.whl')
        bad = []
        for path in wheels:
            try:
                with zipfile.ZipFile(path) as zf:
                    if zf.testzip() is not None:
                        bad.append(path)
            except Exception as exc:
                bad.append(f'{path}: {exc}')
        if bad:
            print('Corrupt wheels:', *bad, sep='\n  ', file=sys.stderr)
            sys.exit(1)
        print(f'Validated {len(wheels)} wheels')
        "

    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}
        path: wheelhouse/*.whl

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install build
      run: python -m pip install --upgrade build

    - name: Build sdist
      run: python -m build --sdist --outdir dist

    - name: Upload sdist
      uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build_wheels, sdist]
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Download wheels
      uses: actions/download-artifact@v4
      with:
        pattern: wheels-*
        merge-multiple: false
        path: wheel-artifacts

    - name: Download sdist
      uses: actions/download-artifact@v4
      with:
        name: sdist
        path: dist

    - name: Collect and validate wheels
      run: |
        python -c "
        import shutil, sys, zipfile
        from pathlib import Path

        dist = Path('dist')
        dist.mkdir(exist_ok=True)
        wheels = sorted(Path('wheel-artifacts').rglob('*.whl'))
        if not wheels:
            print('No wheels found', file=sys.stderr)
            sys.exit(1)

        seen = {}
        for src in wheels:
            dest = dist / src.name
            try:
                with zipfile.ZipFile(src) as zf:
                    if zf.testzip() is not None:
                        raise zipfile.BadZipFile('testzip failed')
            except Exception as exc:
                print(f'SKIP corrupt source {src}: {exc}', file=sys.stderr)
                continue
            if dest.exists():
                print(f'WARN duplicate {src.name}, keeping last valid copy', file=sys.stderr)
            shutil.copy2(src, dest)
            seen[src.name] = src

        final = list(dist.glob('*.whl'))
        bad = []
        for whl in final:
            try:
                with zipfile.ZipFile(whl) as zf:
                    if zf.testzip() is not None:
                        bad.append(whl.name)
            except Exception as exc:
                bad.append(f'{whl.name}: {exc}')
        if bad:
            print('Corrupt wheels in dist:', *bad, sep='\n  ', file=sys.stderr)
            sys.exit(1)
        print(f'Collected {len(final)} wheels for upload')
        "

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        packages-dir: dist
